<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hkr TechShop | Mobile Parts & Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        .product-card:hover { transform: translateY(-5px); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-[#ff6000] text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold italic tracking-wider">Hkr TechShop</h1>
                <p class="text-[10px] uppercase tracking-widest opacity-80">Trusted Mobile Solutions</p>
            </div>
            <div class="flex gap-4">
                <span class="cursor-pointer">🔍</span>
                <span class="cursor-pointer font-bold">🛒 0</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6">
        
        <section id="admin-section" class="hidden mb-10 p-6 bg-white rounded-2xl shadow-2xl border-2 border-orange-500">
            <h2 class="text-xl font-bold mb-4 text-orange-600 flex items-center gap-2">
                ⚙️ অ্যাডমিন প্যানেল <span class="text-sm font-normal text-gray-400">(পণ্য যোগ করুন)</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="pName" placeholder="পণ্যের নাম (যেমন: iPhone 13 Display)" class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-orange-400">
                <input type="number" id="pPrice" placeholder="দাম (টাকা)" class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-orange-400">
                <input type="text" id="pImgLink" placeholder="ImgBB ডাইরেক্ট লিঙ্ক" class="p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-400 bg-blue-50">
                <button onclick="saveProduct()" id="saveBtn" class="md:col-span-3 bg-orange-600 text-white font-bold py-3 rounded-xl hover:bg-orange-700 active:scale-95 transition-all">
                    দোকানে সেভ করুন
                </button>
            </div>
            <p class="text-[11px] mt-2 text-gray-500">নির্দেশনা: ImgBB থেকে ছবির <b>Direct Link</b> এখানে পেস্ট করবেন।</p>
        </section>

        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold border-l-4 border-[#ff6000] pl-3">আমাদের পণ্যসমূহ</h2>
            <div class="text-sm text-gray-500">নতুন আপডেট</div>
        </div>

        <div id="loading" class="text-center py-20">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full"></div>
            <p class="mt-2 text-gray-500">লোডিং হচ্ছে...</p>
        </div>

        <div id="productList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            </div>
    </main>

    <footer class="bg-gray-800 text-white mt-20 py-10">
        <div class="container mx-auto px-4 text-center">
            <p class="font-bold">Hkr TechShop &copy; 2026</p>
            <p class="text-sm opacity-60">দিনাজপুর, বাংলাদেশ</p>
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnVLPIGbxn2rrKL8EwGSCey9A8JNiZkBA",
            authDomain: "hkrtechshop.firebaseapp.com",
            projectId: "hkrtechshop",
            storageBucket: "hkrtechshop.firebasestorage.app",
            messagingSenderId: "988751396186",
            appId: "1:988751396186:web:1fce5757b048963affc763"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ১. অ্যাডমিন মোড চেক (URL-এ ?admin থাকলে প্যানেল খুলবে)
        if (window.location.search.includes('admin')) {
            document.getElementById('admin-section').classList.remove('hidden');
        }

        // ২. ডাটাবেসে পণ্য সেভ করা
        window.saveProduct = async () => {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImgLink').value;
            const btn = document.getElementById('saveBtn');

            if(!name || !price || !img) return alert("সবগুলো তথ্য দিন!");

            btn.disabled = true;
            btn.innerText = "সেভ হচ্ছে...";

            try {
                await addDoc(collection(db, "products"), {
                    name, price, img, date: new Date()
                });
                alert("পণ্যটি সফলভাবে যোগ করা হয়েছে!");
                location.reload();
            } catch (e) {
                alert("এরর! ফায়ারবেস রুলস চেক করুন।");
                btn.disabled = false;
            }
        };

        // ৩. রিয়েল-টাইম ডাটা কাস্টমারকে দেখানো
        const q = query(collection(db, "products"), orderBy("date", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('productList');
            document.getElementById('loading').classList.add('hidden');
            list.innerHTML = "";
            
            snapshot.forEach(doc => {
                const p = doc.data();
                list.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm product-card overflow-hidden border border-gray-100 flex flex-col">
                        <div class="h-40 overflow-hidden bg-gray-200">
                            <img src="${p.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                        </div>
                        <div class="p-3 flex-grow">
                            <h3 class="font-bold text-sm text-gray-700 h-10 overflow-hidden leading-tight">${p.name}</h3>
                            <p class="text-[#ff6000] font-extrabold text-lg mt-2 font-sans">৳ ${p.price}</p>
                        </div>
                        <button class="w-full bg-gray-50 text-gray-600 py-2 text-xs font-bold hover:bg-orange-50 hover:text-[#ff6000] transition-colors border-t border-gray-100">
                            অর্ডার করুন
                        </button>
                    </div>`;
            });
        });
    </script>
</body>
</html>
